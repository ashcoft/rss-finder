name: Release

# Releases are driven by CI rather than by the push itself, so a commit whose
# checks fail is never tagged or published. CI runs on push to main and this
# only fires once that run has concluded successfully for the same SHA.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - main
  # Manual dispatch releases commits not yet covered by the latest tag. It is
  # NOT a retry mechanism: semantic-release creates the tag before it publishes
  # the GitHub Release, so if publication fails the tag already exists and a
  # rerun finds no new commits. Create that GitHub Release by hand instead.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the next version without tagging, committing or publishing
        type: boolean
        default: false

permissions:
  contents: write # push the release commit and tag
  issues: write # comment on released issues
  pull-requests: write # comment on released pull requests

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # workflow_run fires for every CI conclusion, including failures and
    # pull_request runs, so narrow it to a successful push run on main. Manual
    # dispatches must also come from main, otherwise another branch could pick
    # the release configuration that runs with a write-scoped token.
    if: >-
      github.repository == 'ashcoft/rss-finder'
      && (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      || github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main')
    # Releases are serialised: two overlapping runs would race on the same tag.
    # Dry runs get their own group so a queued dry run cannot replace a pending
    # production release (GitHub keeps only one pending run per group).
    concurrency:
      group: release-${{ inputs.dry_run && 'dry-run' || 'publish' }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Release the exact commit CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # semantic-release walks the full history to find the last tag.
          fetch-depth: 0
          # The token is injected into the push URL by semantic-release itself, so it
          # must not also be persisted into .git/config.
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to the v4.3.0 commit, matching eslint.yml: third-party actions are
        # pinned by SHA so a retagged release cannot change what CI runs.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `inputs` is only populated for workflow_dispatch, so push-triggered runs
        # always take the normal (non-dry-run) path.
        run: pnpm exec semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
