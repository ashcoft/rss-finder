# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest

    env:
      # Interim approach: every Snyk command must authenticate, so the scans are
      # skipped until the SNYK_TOKEN repository secret exists. The token is also
      # empty on fork PRs, which keeps those runs green as well.
      # Remove this block (and the matching if: conditions) once the secret is added.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The container scan builds this checkout and needs no remote credentials.
          persist-credentials: false

      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the SAST issues to GitHub Code Scanning
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

        # For Snyk Open Source you must first set up the development environment for your application's dependencies
        # For example for Node
        #- uses: actions/setup-node@v4
        #  with:
        #    node-version: 20

      # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
      # snyk exits 1 when it finds issues, which is expected and must not fail
      # the job; exit 2 (error) and 3 (no supported projects) mean no scan ran.
      - name: Snyk Code test
        if: env.SNYK_TOKEN != ''
        run: |
          set +e
          snyk code test --sarif > snyk-code.sarif
          code=$?
          if [ "$code" -gt 1 ]; then
            echo "::error::snyk code test did not complete (exit $code)"
            exit "$code"
          fi

      # Runs Snyk Open Source (SCA) analysis and uploads result to Snyk.
      # --dev is required here because nearly every dependency is a devDependency.
      - name: Snyk Open Source monitor
        if: env.SNYK_TOKEN != ''
        run: snyk monitor --all-projects --dev

      # Runs Snyk Infrastructure as Code (IaC) analysis and uploads result to Snyk.
      # Exit 1 means findings and exit 3 means this repo has no IaC files, which is
      # the expected steady state here; both are tolerated. Anything else is real.
      - name: Snyk IaC test and report
        if: env.SNYK_TOKEN != ''
        run: |
          set +e
          snyk iac test --report
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::warning::No supported IaC files found; skipping the IaC scan."
          elif [ "$code" -gt 1 ]; then
            echo "::error::snyk iac test did not complete (exit $code)"
            exit "$code"
          fi

      # Build the docker image for testing
      - name: Build a Docker image
        if: env.SNYK_TOKEN != ''
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:snyk-scan .
        # Runs Snyk Container (Container and SCA) analysis and uploads result to Snyk.
      - name: Snyk Container monitor
        if: env.SNYK_TOKEN != ''
        run: snyk container monitor ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:snyk-scan --file=Dockerfile

      # Last, so an upload failure cannot suppress the independent scans above, and
      # gated on !cancelled() so a scan failure above cannot lose the results.
      # A failed scan leaves an empty or malformed file, so only a parseable SARIF
      # is uploaded; a rejected-but-valid upload still fails the job.
      - name: Check Snyk Code SARIF
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' }}
        id: sarif
        run: |
          if [ -s snyk-code.sarif ] && jq -e . snyk-code.sarif > /dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Snyk Code produced no valid SARIF; skipping the Code Scanning upload."
          fi

      - name: Upload result to GitHub Code Scanning
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' && steps.sarif.outputs.valid == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
