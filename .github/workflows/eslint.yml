# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: ['main']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['main']
  schedule:
    - cron: '38 15 * * 2'

permissions:
  contents: read

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Pinned to the v4.3.0 commit; third-party actions are pinned by SHA
        # here so a retagged release cannot change what CI runs.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Lint with the repo's own ESLint 9 and its flat config (eslint.config.js).
      # Config discovery is automatic, so no --config/--ext flags are passed;
      # those legacy flags are rejected by ESLint 9 and --ext never covered
      # .svelte files, which are most of this project's source.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint exits 1 when it reports findings, which is expected and must not
      # fail the job; exit 2 (fatal error) means the scan never completed.
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: 'true'
        run: |
          set +e
          pnpm exec eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif
          code=$?
          if [ "$code" -gt 1 ]; then
            echo "::error::eslint did not complete (exit $code)"
            exit "$code"
          fi

      # Reached only when the step above completed, so the SARIF file exists.
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
